name: release-candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer release version
        required: true
        type: string
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Resolve version
        id: version
        shell: bash
        run: |
          version='${{ inputs.version }}'
          if [[ -z "$version" ]]; then version='${{ github.ref_name }}'; version="${version#v}"; fi
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo 'Invalid SemVer' >&2; exit 1; }
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Restore and test backend
        run: |
          dotnet restore ERP.slnx --locked-mode
          dotnet test ERP.slnx --no-restore -c Release
          dotnet list ERP.slnx package --vulnerable --include-transitive
      - name: Verify frontend
        working-directory: apps/web
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
          npm audit --audit-level=moderate
      - name: Build immutable Linux package
        run: |
          ./deploy/linux/Build-Release.sh '${{ steps.version.outputs.value }}' \
            "$GITHUB_WORKSPACE/artifacts"
      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: erp-${{ steps.version.outputs.value }}-linux-x64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
